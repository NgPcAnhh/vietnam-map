<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bản Đồ Thị Trường Việc Làm Việt Nam - Power BI</title>

  <!-- Leaflet CSS từ CDN -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }

    /* Khung chứa toàn màn hình */
    #dashboard-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Thanh điều khiển trên cùng */
    .top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.1);
    }

    .top-bar .title {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      margin-right: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .filter-btn {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .filter-btn.active {
      background: #ea580c;
      color: #ffffff;
      border-color: #ea580c;
    }

    /* Bảng chú thích mật độ */
    .density-legend {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.1);
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .legend-dot {
      display: inline-block;
      border-radius: 50%;
    }

    /* Khung bản đồ */
    #map-view {
      width: 100%;
      height: 100%;
      background: #aad3df;
    }

    /* Custom Leaflet Markers & Radar Animation */
    .custom-leaflet-icon {
      background: transparent;
      border: none;
    }

    .hub-marker-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hub-pulse-radar {
      position: absolute;
      border-radius: 50%;
      opacity: 0.45;
      animation: mapRadarPulse 2s infinite ease-in-out;
    }

    .hub-center-core {
      position: relative;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      z-index: 2;
    }

    @keyframes mapRadarPulse {
      0% {
        transform: scale(0.6);
        opacity: 0.8;
      }
      70% {
        transform: scale(1.6);
        opacity: 0;
      }
      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }

    /* Style Tooltip */
    .leaflet-permanent-hub-card {
      background: #ffffff !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 8px !important;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.14) !important;
      padding: 6px 10px !important;
      font-family: inherit !important;
    }

    .leaflet-hover-node-card {
      background: #ffffff !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 8px !important;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.16) !important;
      padding: 8px 12px !important;
      font-family: inherit !important;
    }
  </style>
</head>
<body>
  <div id="dashboard-container">
    <!-- Toolbar miền -->
    <div class="top-bar">
      <span class="title">🇻🇳 Việc Làm Theo Vùng</span>
      <button class="filter-btn active" onclick="applyRegionFilter('all')">Tất cả</button>
      <button class="filter-btn" onclick="applyRegionFilter('north')">Miền Bắc</button>
      <button class="filter-btn" onclick="applyRegionFilter('central')">Miền Trung</button>
      <button class="filter-btn" onclick="applyRegionFilter('south')">Miền Nam</button>
    </div>

    <!-- Chú thích mật độ -->
    <div class="density-legend">
      <span style="color: #0f172a; font-weight: 700;">Quy mô:</span>
      <span class="legend-item">
        <span class="legend-dot" style="width: 10px; height: 10px; background: #ea580c;"></span> &gt;1.000 việc
      </span>
      <span class="legend-item">
        <span class="legend-dot" style="width: 8px; height: 8px; background: #f97316;"></span> &gt;50 việc
      </span>
      <span class="legend-item">
        <span class="legend-dot" style="width: 6px; height: 6px; background: #0284c7;"></span> &gt;10 việc
      </span>
    </div>

    <!-- Nơi render bản đồ -->
    <div id="map-view"></div>
  </div>

  <!-- Leaflet JS từ CDN -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script>
    /**
     * DỮ LIỆU BAN ĐẦU (Mô phỏng 2 biến: location_standard & DistinctCount job_title)
     * Khi Power BI truyền dữ liệu mới vào, hàm updateMapData() sẽ cập nhật lại toàn bộ bản đồ.
     */
    let currentData = [
      { location_standard: "Hà Nội", distinct_job_titles: 1442 },
      { location_standard: "Hồ Chí Minh", distinct_job_titles: 1143 },
      { location_standard: "Hải Phòng", distinct_job_titles: 120 },
      { location_standard: "Bắc Ninh", distinct_job_titles: 101 },
      { location_standard: "Đồng Nai", distinct_job_titles: 86 },
      { location_standard: "Hưng Yên", distinct_job_titles: 82 },
      { location_standard: "Bình Dương", distinct_job_titles: 71 },
      { location_standard: "Đà Nẵng", distinct_job_titles: 63 },
      { location_standard: "Hải Dương", distinct_job_titles: 51 },
      { location_standard: "Bà Rịa - Vũng Tàu", distinct_job_titles: 28 },
      { location_standard: "Cà Mau", distinct_job_titles: 24 },
      { location_standard: "Thái Nguyên", distinct_job_titles: 22 },
      { location_standard: "Long An", distinct_job_titles: 22 },
      { location_standard: "Khánh Hòa", distinct_job_titles: 21 },
      { location_standard: "Bắc Giang", distinct_job_titles: 20 },
      { location_standard: "Nghệ An", distinct_job_titles: 18 },
      { location_standard: "Quảng Ninh", distinct_job_titles: 16 },
      { location_standard: "Cần Thơ", distinct_job_titles: 14 },
      { location_standard: "Kiên Giang", distinct_job_titles: 14 },
      { location_standard: "Tây Ninh", distinct_job_titles: 14 },
      { location_standard: "Hà Nam", distinct_job_titles: 12 },
      { location_standard: "Lâm Đồng", distinct_job_titles: 12 },
      { location_standard: "Bến Tre", distinct_job_titles: 11 },
      { location_standard: "Thanh Hóa", distinct_job_titles: 11 },
      { location_standard: "Tiền Giang", distinct_job_titles: 10 },
      { location_standard: "Quảng Nam", distinct_job_titles: 9 },
      { location_standard: "Thừa Thiên Huế", distinct_job_titles: 7 },
      { location_standard: "Quảng Ngãi", distinct_job_titles: 7 },
      { location_standard: "Vĩnh Phúc", distinct_job_titles: 5 },
      { location_standard: "Thái Bình", distinct_job_titles: 5 },
      { location_standard: "Bình Định", distinct_job_titles: 2 },
      { location_standard: "Nam Định", distinct_job_titles: 1 },
      { location_standard: "Bình Phước", distinct_job_titles: 1 }
    ];

    // Từ điển tọa độ chuẩn xác các tỉnh/thành Việt Nam
    const VIETNAM_GEO_INDEX = {
      "hà nội": { lat: 21.0285, lng: 105.8542, region: "north", isHub: true },
      "hải phòng": { lat: 20.8449, lng: 106.6881, region: "north" },
      "quảng ninh": { lat: 20.9599, lng: 107.0425, region: "north" },
      "bắc ninh": { lat: 21.1861, lng: 106.0763, region: "north" },
      "hưng yên": { lat: 20.6464, lng: 106.0511, region: "north" },
      "hải dương": { lat: 20.9373, lng: 106.3146, region: "north" },
      "vĩnh phúc": { lat: 21.3089, lng: 105.6049, region: "north" },
      "thái nguyên": { lat: 21.5928, lng: 105.8442, region: "north" },
      "bắc giang": { lat: 21.2731, lng: 106.1946, region: "north" },
      "hà nam": { lat: 20.5450, lng: 105.9120, region: "north" },
      "nam định": { lat: 20.4344, lng: 106.1773, region: "north" },
      "thái bình": { lat: 20.4463, lng: 106.3366, region: "north" },
      "thanh hóa": { lat: 19.8067, lng: 105.7852, region: "north" },
      "nghệ an": { lat: 18.6734, lng: 105.6813, region: "north" },
      "hà tĩnh": { lat: 18.3429, lng: 105.9059, region: "north" },

      "đà nẵng": { lat: 16.0544, lng: 108.2022, region: "central", isHub: true },
      "thừa thiên huế": { lat: 16.4637, lng: 107.5909, region: "central" },
      "quảng trị": { lat: 16.8163, lng: 107.1001, region: "central" },
      "quảng bình": { lat: 17.4690, lng: 106.6225, region: "central" },
      "quảng nam": { lat: 15.5651, lng: 108.4815, region: "central" },
      "quảng ngãi": { lat: 15.1205, lng: 108.7923, region: "central" },
      "bình định": { lat: 13.7820, lng: 109.2197, region: "central" },
      "phú yên": { lat: 13.0882, lng: 109.3075, region: "central" },
      "khánh hòa": { lat: 12.2388, lng: 109.1967, region: "central" },
      "đắk lắk": { lat: 12.6667, lng: 108.0383, region: "central" },
      "gia lai": { lat: 13.9833, lng: 108.0000, region: "central" },
      "lâm đồng": { lat: 11.9404, lng: 108.4583, region: "central" },
      "bình thuận": { lat: 10.9273, lng: 108.1022, region: "central" },

      "hồ chí minh": { lat: 10.8231, lng: 106.6297, region: "south", isHub: true },
      "bình dương": { lat: 11.1606, lng: 106.6570, region: "south" },
      "đồng nai": { lat: 10.9575, lng: 106.8426, region: "south" },
      "bà rịa - vũng tàu": { lat: 10.4966, lng: 107.1685, region: "south" },
      "tây ninh": { lat: 11.3100, lng: 106.0980, region: "south" },
      "bình phước": { lat: 11.5330, lng: 106.8830, region: "south" },
      "long an": { lat: 10.5361, lng: 106.4116, region: "south" },
      "tiền giang": { lat: 10.3600, lng: 106.3600, region: "south" },
      "bến tre": { lat: 10.2430, lng: 106.3750, region: "south" },
      "cần thơ": { lat: 10.0452, lng: 105.7469, region: "south" },
      "đồng tháp": { lat: 10.4578, lng: 105.6331, region: "south" },
      "an giang": { lat: 10.3759, lng: 105.4185, region: "south" },
      "kiên giang": { lat: 10.0125, lng: 105.0809, region: "south" },
      "cà mau": { lat: 9.1769, lng: 105.1524, region: "south" }
    };

    let mapInstance = null;
    let markersLayer = null;
    let activeRegion = "all";

    // Chuẩn hóa tên tỉnh từ Power BI (bỏ các tiền tố TP, Tỉnh, viết thường)
    function cleanLocationName(rawName) {
      if (!rawName) return "";
      let s = rawName.toString().toLowerCase().trim();
      s = s.replace(/^tp\.?\s*/, "")
           .replace(/^thành phố\s*/, "")
           .replace(/^tỉnh\s*/, "")
           .trim();
      if (s === "hcm" || s === "tp hcm" || s === "sài gòn") return "hồ chí minh";
      if (s === "hn") return "hà nội";
      if (s === "dn") return "đà nẵng";
      return s;
    }

    // Khởi tạo bản đồ Leaflet
    function setupMap() {
      mapInstance = L.map("map-view", {
        center: [16.0, 107.5],
        zoom: 6,
        minZoom: 5,
        maxZoom: 15,
        zoomControl: true
      });

      // Lớp Tile Esri World Street Map (Miễn phí, không watermark, chi tiết)
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
        maxZoom: 18,
        attribution: "Bản đồ &copy; Esri &mdash; Power BI Vietnam Map"
      }).addTo(mapInstance);

      markersLayer = L.layerGroup().addTo(mapInstance);

      renderMapMarkers();

      window.addEventListener("resize", () => {
        if (mapInstance) mapInstance.invalidateSize();
      });
      setTimeout(() => mapInstance.invalidateSize(), 300);
    }

    // Vẽ toàn bộ các điểm node dựa trên dữ liệu đang có
    function renderMapMarkers() {
      if (!markersLayer) return;
      markersLayer.clearLayers();

      // Tính tổng số job để tính phần trăm (%)
      let grandTotal = 0;
      currentData.forEach(row => {
        const count = row.distinct_job_titles || row.job_title_count || row.count || 0;
        grandTotal += Number(count);
      });

      currentData.forEach(row => {
        const rawLoc = row.location_standard || row.name || "";
        const cleanName = cleanLocationName(rawLoc);
        const geoInfo = VIETNAM_GEO_INDEX[cleanName];

        if (!geoInfo) return;

        // Lọc theo miền nếu có
        if (activeRegion !== "all" && geoInfo.region !== activeRegion) {
          return;
        }

        const count = Number(row.distinct_job_titles || row.job_title_count || row.count || 0);
        const percentage = grandTotal > 0 ? ((count / grandTotal) * 100).toFixed(1) : "0.0";
        const isKeyHub = geoInfo.isHub;

        // Bảng màu & Kích thước tương ứng số lượng job
        let color = "#94a3b8";
        let dotSize = 8;

        if (count >= 1000) {
          dotSize = 32;
          color = cleanName === "hồ chí minh" ? "#16a34a" : (cleanName === "đà nẵng" ? "#0284c7" : "#ea580c");
        } else if (count >= 100) {
          dotSize = 22;
          color = "#ea580c";
        } else if (count >= 50) {
          dotSize = 16;
          color = "#f97316";
        } else if (count >= 20) {
          dotSize = 13;
          color = "#0284c7";
        } else if (count > 0) {
          dotSize = 10;
          color = "#38bdf8";
        }

        let iconMarkup = "";
        let iconDimensions = [dotSize, dotSize];
        let iconPivot = [dotSize / 2, dotSize / 2];

        if (isKeyHub) {
          const radarRingSize = dotSize + 14;
          iconDimensions = [radarRingSize, radarRingSize];
          iconPivot = [radarRingSize / 2, radarRingSize / 2];
          iconMarkup = `
            <div class="hub-marker-wrapper" style="width: ${radarRingSize}px; height: ${radarRingSize}px;">
              <span class="hub-pulse-radar" style="width: ${radarRingSize}px; height: ${radarRingSize}px; background-color: ${color};"></span>
              <span class="hub-center-core" style="width: ${dotSize}px; height: ${dotSize}px; background-color: ${color};"></span>
            </div>
          `;
        } else {
          iconMarkup = `
            <div style="
              width: ${dotSize}px;
              height: ${dotSize}px;
              background-color: ${color};
              border: 2px solid #ffffff;
              border-radius: 50%;
              box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            "></div>
          `;
        }

        const divIcon = L.divIcon({
          className: "custom-leaflet-icon",
          html: iconMarkup,
          iconSize: iconDimensions,
          iconAnchor: iconPivot
        });

        const marker = L.marker([geoInfo.lat, geoInfo.lng], { icon: divIcon });

        // Tooltip cố định cho 3 cực (Hà Nội, Đà Nẵng, HCM)
        if (isKeyHub) {
          const hubIconEmoji = cleanName === "hồ chí minh" ? "🚀" : (cleanName === "đà nẵng" ? "🌴" : "🏛️");
          const cardHtml = `
            <div style="border-left: 3.5px solid ${color}; padding: 2px 4px;">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 2px;">
                <strong style="font-size: 12px; color: ${color}; font-weight: 800;">
                  ${hubIconEmoji} ${rawLoc}
                </strong>
                <span style="font-size: 10px; font-weight: 700; color: ${color}; background: #f8fafc; padding: 1px 4px; border-radius: 4px; border: 1px solid ${color}40;">
                  ${percentage}%
                </span>
              </div>
              <div style="font-size: 11px; font-weight: 700; color: #0f172a;">💼 ${count.toLocaleString()} việc làm</div>
            </div>
          `;

          marker.bindTooltip(cardHtml, {
            permanent: true,
            direction: cleanName === "đà nẵng" ? "right" : "left",
            offset: cleanName === "đà nẵng" ? [16, 0] : [-16, 0],
            className: "leaflet-permanent-hub-card"
          });
        } else {
          // Tooltip khi hover cho các tỉnh còn lại
          const hoverHtml = `
            <div style="font-size: 11px; color: #0f172a; line-height: 1.4;">
              <strong style="font-size: 12px; color: #ea580c;">📍 ${rawLoc}</strong><br/>
              💼 Số việc làm: <b>${count.toLocaleString()}</b> (${percentage}%)
            </div>
          `;

          marker.bindTooltip(hoverHtml, {
            permanent: false,
            sticky: true,
            direction: "top",
            offset: [0, -dotSize / 2 - 2],
            className: "leaflet-hover-node-card"
          });
        }

        marker.addTo(markersLayer);
      });
    }

    // Lọc theo miền
    function applyRegionFilter(regionKey) {
      activeRegion = regionKey;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      if (window.event && window.event.target) {
        window.event.target.classList.add("active");
      }

      renderMapMarkers();

      if (regionKey === "north") {
        mapInstance.flyTo([21.0, 105.8], 7, { duration: 0.6 });
      } else if (regionKey === "central") {
        mapInstance.flyTo([15.8, 108.2], 7, { duration: 0.6 });
      } else if (regionKey === "south") {
        mapInstance.flyTo([10.5, 106.6], 7, { duration: 0.6 });
      } else {
        mapInstance.flyTo([16.0, 107.5], 6, { duration: 0.6 });
      }
    }

    /**
     * HÀM NHẬN DATA TỪ POWER BI / BÊN NGOÀI
     * Format truyền vào: Array các Object [{ location_standard: "Hà Nội", distinct_job_titles: 1500 }, ...]
     */
    window.updateMapData = function(newData) {
      if (Array.isArray(newData)) {
        currentData = newData;
        renderMapMarkers();
      }
    };

    // Lắng nghe Message event nếu trang được nhúng qua iframe từ Power BI
    window.addEventListener("message", function(event) {
      if (event.data && event.data.type === "UPDATE_JOBS_MAP") {
        window.updateMapData(event.data.payload);
      }
    });

    // Khởi chạy khi DOM sẵn sàng
    window.addEventListener("DOMContentLoaded", () => {
      // Kiểm tra xem có dữ liệu gắn sẵn trong window.powerBIData không
      if (window.powerBIData && Array.isArray(window.powerBIData)) {
        currentData = window.powerBIData;
      }
      setupMap();
    });
  </script>
</body>
</html>
