<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vietnam Job Market Map - Power BI</title>
  
  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8fafc;
    }

    #map-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 500px;
      background: #aad3df;
    }

    #vietnam-map {
      width: 100%;
      height: 100%;
    }

    /* Region Filter Buttons */
    .region-toolbar {
      position: absolute;
      top: 12px;
      left: 60px;
      z-index: 1000;
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.95);
      padding: 4px;
      border-radius: 8px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.12);
      border: 1px solid #cbd5e1;
    }

    .region-btn {
      border: none;
      background: transparent;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .region-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .region-btn.active {
      background: #ea580c;
      color: #ffffff;
    }

    /* Legend Badge */
    .map-legend {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.12);
      border: 1px solid #cbd5e1;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      display: inline-block;
      border-radius: 50%;
    }

    /* Marker Elements */
    .custom-map-icon {
      background: transparent;
      border: none;
    }

    .leaflet-hub-marker {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .leaflet-hub-marker .hub-pulse {
      position: absolute;
      border-radius: 50%;
      opacity: 0.45;
      animation: mapPulse 2s infinite ease-in-out;
    }

    .leaflet-hub-marker .hub-dot {
      position: relative;
      border-radius: 50%;
      border: 2.5px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      z-index: 2;
    }

    @keyframes mapPulse {
      0% {
        transform: scale(0.6);
        opacity: 0.8;
      }
      70% {
        transform: scale(1.5);
        opacity: 0;
      }
      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }

    /* Tooltips */
    .leaflet-permanent-tooltip {
      background: #ffffff !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 8px !important;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.12) !important;
      padding: 6px 8px !important;
    }

    .leaflet-hover-tooltip {
      background: #ffffff !important;
      border: 1px solid #cbd5e1 !important;
      border-radius: 8px !important;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.16) !important;
      padding: 6px 10px !important;
    }
  </style>
</head>
<body>
  <div id="map-wrapper">
    <!-- Toolbar miền -->
    <div class="region-toolbar">
      <button class="region-btn active" onclick="setRegion('all')">Tất cả</button>
      <button class="region-btn" onclick="setRegion('north')">Miền Bắc</button>
      <button class="region-btn" onclick="setRegion('central')">Miền Trung</button>
      <button class="region-btn" onclick="setRegion('south')">Miền Nam</button>
    </div>

    <!-- Chú thích mật độ -->
    <div class="map-legend">
      <strong style="color: #0f172a;">Mật độ:</strong>
      <span class="legend-item">
        <span class="legend-dot" style="width: 10px; height: 10px; background: #ea580c;"></span> &gt;1.000
      </span>
      <span class="legend-item">
        <span class="legend-dot" style="width: 8px; height: 8px; background: #f97316;"></span> &gt;50
      </span>
      <span class="legend-item">
        <span class="legend-dot" style="width: 6px; height: 6px; background: #0284c7;"></span> &gt;10
      </span>
    </div>

    <!-- Khung bản đồ -->
    <div id="vietnam-map"></div>
  </div>

  <!-- Leaflet JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <script>
    // Dữ liệu baseline các tỉnh thành
    const BASELINE_STATS = {
      'hà nội': { jobCount: 1442, companyCount: 830, percentage: 32.1 },
      'hồ chí minh': { jobCount: 1143, companyCount: 759, percentage: 25.4 },
      'đà nẵng': { jobCount: 63, companyCount: 44, percentage: 1.4 },
      'hải phòng': { jobCount: 120, companyCount: 79, percentage: 2.7 },
      'bắc ninh': { jobCount: 101, companyCount: 70, percentage: 2.2 },
      'đồng nai': { jobCount: 86, companyCount: 63, percentage: 1.9 },
      'hưng yên': { jobCount: 82, companyCount: 56, percentage: 1.8 },
      'bình dương': { jobCount: 71, companyCount: 34, percentage: 1.6 },
      'hải dương': { jobCount: 51, companyCount: 24, percentage: 1.1 },
      'bà rịa - vũng tàu': { jobCount: 28, companyCount: 21, percentage: 0.6 },
      'cà mau': { jobCount: 24, companyCount: 5, percentage: 0.5 },
      'thái nguyên': { jobCount: 22, companyCount: 15, percentage: 0.5 },
      'long an': { jobCount: 22, companyCount: 18, percentage: 0.5 },
      'khánh hòa': { jobCount: 21, companyCount: 17, percentage: 0.5 },
      'bắc giang': { jobCount: 20, companyCount: 9, percentage: 0.4 },
      'nghệ an': { jobCount: 18, companyCount: 15, percentage: 0.4 },
      'quảng ninh': { jobCount: 16, companyCount: 14, percentage: 0.4 },
      'cần thơ': { jobCount: 14, companyCount: 10, percentage: 0.3 },
      'kiên giang': { jobCount: 14, companyCount: 7, percentage: 0.3 },
      'tây ninh': { jobCount: 14, companyCount: 10, percentage: 0.3 },
      'hà nam': { jobCount: 12, companyCount: 10, percentage: 0.3 },
      'lâm đồng': { jobCount: 12, companyCount: 8, percentage: 0.3 },
      'bến tre': { jobCount: 11, companyCount: 4, percentage: 0.2 },
      'thanh hóa': { jobCount: 11, companyCount: 9, percentage: 0.2 },
      'tiền giang': { jobCount: 10, companyCount: 6, percentage: 0.2 },
      'quảng nam': { jobCount: 9, companyCount: 5, percentage: 0.2 },
      'thừa thiên huế': { jobCount: 7, companyCount: 4, percentage: 0.2 },
      'quảng ngãi': { jobCount: 7, companyCount: 6, percentage: 0.2 },
      'vĩnh phúc': { jobCount: 5, companyCount: 5, percentage: 0.1 },
      'thái bình': { jobCount: 5, companyCount: 5, percentage: 0.1 },
      'bình định': { jobCount: 2, companyCount: 2, percentage: 0.0 },
      'nam định': { jobCount: 1, companyCount: 1, percentage: 0.0 },
      'bình phước': { jobCount: 1, companyCount: 1, percentage: 0.0 }
    };

    // Tọa độ địa lý các tỉnh
    const VIETNAM_GEO_NODES = [
      { id: 'hanoi', name: 'Hà Nội', region: 'north', lat: 21.0285, lng: 105.8542, isKeyHub: true },
      { id: 'haiphong', name: 'Hải Phòng', region: 'north', lat: 20.8449, lng: 106.6881 },
      { id: 'quangninh', name: 'Quảng Ninh', region: 'north', lat: 20.9599, lng: 107.0425 },
      { id: 'bacninh', name: 'Bắc Ninh', region: 'north', lat: 21.1861, lng: 106.0763 },
      { id: 'hungyen', name: 'Hưng Yên', region: 'north', lat: 20.6464, lng: 106.0511 },
      { id: 'haiduong', name: 'Hải Dương', region: 'north', lat: 20.9373, lng: 106.3146 },
      { id: 'vinhphuc', name: 'Vĩnh Phúc', region: 'north', lat: 21.3089, lng: 105.6049 },
      { id: 'thainguyen', name: 'Thái Nguyên', region: 'north', lat: 21.5928, lng: 105.8442 },
      { id: 'bacgiang', name: 'Bắc Giang', region: 'north', lat: 21.2731, lng: 106.1946 },
      { id: 'hanam', name: 'Hà Nam', region: 'north', lat: 20.545, lng: 105.912 },
      { id: 'namdinh', name: 'Nam Định', region: 'north', lat: 20.4344, lng: 106.1773 },
      { id: 'thaibinh', name: 'Thái Bình', region: 'north', lat: 20.4463, lng: 106.3366 },
      { id: 'thanhhoa', name: 'Thanh Hóa', region: 'north', lat: 19.8067, lng: 105.7852 },
      { id: 'nghean', name: 'Nghệ An', region: 'north', lat: 18.6734, lng: 105.6813 },
      
      { id: 'danang', name: 'Đà Nẵng', region: 'central', lat: 16.0544, lng: 108.2022, isKeyHub: true },
      { id: 'thuathienhue', name: 'Thừa Thiên Huế', region: 'central', lat: 16.4637, lng: 107.5909 },
      { id: 'quangnam', name: 'Quảng Nam', region: 'central', lat: 15.5651, lng: 108.4815 },
      { id: 'quangngai', name: 'Quảng Ngãi', region: 'central', lat: 15.1205, lng: 108.7923 },
      { id: 'binhdinh', name: 'Bình Định', region: 'central', lat: 13.782, lng: 109.2197 },
      { id: 'khanhhoa', name: 'Khánh Hòa', region: 'central', lat: 12.2388, lng: 109.1967 },
      { id: 'lamdong', name: 'Lâm Đồng', region: 'central', lat: 11.9404, lng: 108.4583 },

      { id: 'hochiminh', name: 'Hồ Chí Minh', region: 'south', lat: 10.8231, lng: 106.6297, isKeyHub: true },
      { id: 'binhduong', name: 'Bình Dương', region: 'south', lat: 11.1606, lng: 106.657 },
      { id: 'dongnai', name: 'Đồng Nai', region: 'south', lat: 10.9575, lng: 106.8426 },
      { id: 'bariavungtau', name: 'Bà Rịa - Vũng Tàu', region: 'south', lat: 10.4966, lng: 107.1685 },
      { id: 'tayninh', name: 'Tây Ninh', region: 'south', lat: 11.31, lng: 106.098 },
      { id: 'binhphuoc', name: 'Bình Phước', region: 'south', lat: 11.533, lng: 106.883 },
      { id: 'longan', name: 'Long An', region: 'south', lat: 10.5361, lng: 106.4116 },
      { id: 'tiengiang', name: 'Tiền Giang', region: 'south', lat: 10.36, lng: 106.36 },
      { id: 'bentre', name: 'Bến Tre', region: 'south', lat: 10.243, lng: 106.375 },
      { id: 'cantho', name: 'Cần Thơ', region: 'south', lat: 10.0452, lng: 105.7469 },
      { id: 'kiengiang', name: 'Kiên Giang', region: 'south', lat: 10.0125, lng: 105.0809 },
      { id: 'camau', name: 'Cà Mau', region: 'south', lat: 9.1769, lng: 105.1524 }
    ];

    let map;
    let layerGroup;
    let currentRegion = 'all';

    function initMap() {
      // Khởi tạo Leaflet Map
      map = L.map('vietnam-map', {
        center: [16.0, 107.5],
        zoom: 6,
        minZoom: 5,
        maxZoom: 14,
        zoomControl: true
      });

      // Lớp bản đồ ESRI World Street Map (Miễn phí, không watermark, độ nét cao)
      L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
        {
          maxZoom: 18,
          attribution: 'Bản đồ &copy; Esri &mdash; Vietnam Job Market'
        }
      ).addTo(map);

      layerGroup = L.layerGroup().addTo(map);
      renderMarkers();

      // Fix tự động căn kích thước trong khung Power BI
      setTimeout(() => map.invalidateSize(), 200);
      window.addEventListener('resize', () => map.invalidateSize());
    }

    function renderMarkers() {
      layerGroup.clearLayers();

      const nodes = currentRegion === 'all'
        ? VIETNAM_GEO_NODES
        : VIETNAM_GEO_NODES.filter(n => n.region === currentRegion);

      nodes.forEach(node => {
        const key = node.name.toLowerCase();
        const stat = BASELINE_STATS[key] || { jobCount: 0, companyCount: 0, percentage: 0 };
        const count = stat.jobCount;
        const isHub = node.isKeyHub;

        let hubColor = '#ea580c';
        if (node.id === 'danang') hubColor = '#0284c7';
        if (node.id === 'hochiminh') hubColor = '#16a34a';

        let dotSize = 8;
        let dotColor = '#94a3b8';

        if (count >= 1000) {
          dotSize = 32;
          dotColor = hubColor;
        } else if (count >= 100) {
          dotSize = 22;
          dotColor = '#ea580c';
        } else if (count >= 50) {
          dotSize = 16;
          dotColor = '#f97316';
        } else if (count >= 20) {
          dotSize = 13;
          dotColor = '#0284c7';
        } else if (count >= 10) {
          dotSize = 10;
          dotColor = '#0284c7';
        } else {
          dotSize = 7;
          dotColor = '#38bdf8';
        }

        let iconHtml = '';
        let iconSize = [dotSize, dotSize];
        let iconAnchor = [dotSize / 2, dotSize / 2];

        if (isHub) {
          const outerSize = Math.max(36, dotSize + 10);
          iconSize = [outerSize, outerSize];
          iconAnchor = [outerSize / 2, outerSize / 2];
          iconHtml = `
            <div class="leaflet-hub-marker" style="width: ${outerSize}px; height: ${outerSize}px;">
              <span class="hub-pulse" style="width: ${outerSize}px; height: ${outerSize}px; background-color: ${hubColor};"></span>
              <span class="hub-dot" style="width: ${dotSize - 10}px; height: ${dotSize - 10}px; background-color: ${hubColor};"></span>
            </div>
          `;
        } else {
          iconHtml = `
            <div style="
              width: ${dotSize}px;
              height: ${dotSize}px;
              background-color: ${dotColor};
              border: 2px solid #ffffff;
              border-radius: 50%;
              box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            "></div>
          `;
        }

        const markerIcon = L.divIcon({
          className: 'custom-map-icon',
          html: iconHtml,
          iconSize: iconSize,
          iconAnchor: iconAnchor
        });

        const marker = L.marker([node.lat, node.lng], { icon: markerIcon });

        // Tooltip cố định cho 3 Hubs lớn
        if (isHub) {
          const tooltipContent = `
            <div style="border-left: 3.5px solid ${hubColor}; padding: 2px 4px;">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 2px;">
                <strong style="font-size: 12px; color: ${hubColor}; font-weight: 800;">
                  ${node.id === 'hanoi' ? '🏛️' : node.id === 'danang' ? '🌴' : '🚀'} ${node.name}
                </strong>
                <span style="font-size: 10px; font-weight: 700; color: ${hubColor}; background: #f8fafc; padding: 1px 4px; border-radius: 4px; border: 1px solid ${hubColor}40;">
                  ${stat.percentage}%
                </span>
              </div>
              <div style="font-size: 11px; font-weight: 700; color: #0f172a;">💼 ${stat.jobCount.toLocaleString()} việc làm</div>
              <div style="font-size: 10px; color: #475569;">🏢 ${stat.companyCount.toLocaleString()} công ty</div>
            </div>
          `;

          marker.bindTooltip(tooltipContent, {
            permanent: true,
            direction: node.id === 'danang' ? 'right' : 'left',
            offset: node.id === 'danang' ? [14, 0] : [-14, 0],
            className: 'leaflet-permanent-tooltip'
          });
        } else {
          // Tooltip hover cho các tỉnh còn lại
          const hoverContent = `
            <div style="font-size: 11px; color: #0f172a; line-height: 1.4;">
              <strong style="color: #ea580c; font-size: 12px;">📍 ${node.name}</strong><br/>
              💼 Việc làm: <b>${stat.jobCount.toLocaleString()}</b> (${stat.percentage}%)<br/>
              🏢 Công ty: <b>${stat.companyCount.toLocaleString()}</b>
            </div>
          `;

          marker.bindTooltip(hoverContent, {
            permanent: false,
            sticky: true,
            direction: 'top',
            offset: [0, -dotSize / 2 - 2],
            className: 'leaflet-hover-tooltip'
          });
        }

        marker.addTo(layerGroup);
      });
    }

    function setRegion(region) {
      currentRegion = region;
      document.querySelectorAll('.region-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = event ? event.target : document.querySelector('.region-btn');
      if (activeBtn) activeBtn.classList.add('active');

      renderMarkers();

      if (region === 'north') {
        map.flyTo([21.0, 105.8], 7, { duration: 0.6 });
      } else if (region === 'central') {
        map.flyTo([15.8, 108.2], 7, { duration: 0.6 });
      } else if (region === 'south') {
        map.flyTo([10.5, 106.6], 7, { duration: 0.6 });
      } else {
        map.flyTo([16.0, 107.5], 6, { duration: 0.6 });
      }
    }

    window.addEventListener('DOMContentLoaded', initMap);
  </script>
</body>
</html>
